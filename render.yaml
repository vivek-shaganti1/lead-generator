services:
  # ===========================================================================
  # 🚀 FastAPI Backend Web Service
  # ===========================================================================
  - type: web
    name: leadgen-backend
    runtime: python
    rootDir: backend
    plan: starter
    buildCommand: pip install -r requirements.txt
    startCommand: uvicorn app.main:create_app --factory --host 0.0.0.0 --port $PORT --proxy-headers --forwarded-allow-ips='*'
    healthCheckPath: /health
    envVars:
      - key: PYTHON_VERSION
        value: 3.12.7
      - key: ENV
        value: prod
      - key: DEBUG
        value: false
      - key: SECRET_KEY
        generateValue: true
      - key: CORS_ORIGINS
        value: "https://*,http://localhost:3000"
      - key: DRY_RUN
        value: false
      - key: REQUIRE_MANUAL_APPROVAL
        value: false
      - key: SENDER_NAME
        value: "KSV Web & AI Solutions Team"
      - key: SENDER_EMAIL
        value: "ksvdevlopers@gmail.com"
      - key: SMTP_HOST
        value: "smtp.gmail.com"
      - key: SMTP_PORT
        value: 465
      - key: SMTP_USER
        value: "ksvdevlopers@gmail.com"
      - key: SMTP_PASSWORD
        sync: false
      - key: SMTP_SSL
        value: true
      - key: SMTP_STARTTLS
        value: false
      - key: IMAP_HOST
        value: "imap.gmail.com"
      - key: IMAP_PORT
        value: 993
      - key: IMAP_USER
        value: "ksvdevlopers@gmail.com"
      - key: IMAP_PASSWORD
        sync: false
      - key: IMAP_SSL
        value: true
      - key: DATABASE_URL
        fromDatabase:
          name: leadgen-postgres
          property: connectionString
      - key: REDIS_URL
        fromService:
          type: redis
          name: leadgen-redis
          property: connectionString

  # ===========================================================================
  # ⚙️ Celery Autonomous Outreach & Ingestion Worker
  # ===========================================================================
  - type: worker
    name: leadgen-worker
    runtime: python
    rootDir: backend
    plan: starter
    buildCommand: pip install -r requirements.txt
    startCommand: celery -A app.workers.celery_app.celery_app worker --loglevel=info --concurrency=2
    envVars:
      - key: PYTHON_VERSION
        value: 3.12.7
      - key: ENV
        value: prod
      - key: DRY_RUN
        value: false
      - key: DATABASE_URL
        fromDatabase:
          name: leadgen-postgres
          property: connectionString
      - key: REDIS_URL
        fromService:
          type: redis
          name: leadgen-redis
          property: connectionString

# ===========================================================================
# 🗄️ Managed Databases
# ===========================================================================
databases:
  - name: leadgen-postgres
    databaseName: leadgen
    user: leadgen
    plan: free
